<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Claude Code RTL</title>
  <desc id="d">Right-to-left text for Persian, Arabic and Hebrew in Claude Code: the same sentences before and after the plugin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#1b1537"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="-apple-system, 'Segoe UI', system-ui, Roboto, 'Noto Sans', 'Noto Sans Arabic', 'Noto Sans Hebrew', Tahoma, sans-serif">
    <text x="64" y="112" font-size="64" font-weight="800" fill="#ffffff">Claude Code <tspan fill="url(#accent)">RTL</tspan></text>
    <text x="64" y="162" font-size="28" fill="#a5adc6">Right-to-left text for Persian · Arabic · Hebrew</text>
    <text x="1216" y="112" font-size="34" font-weight="700" fill="#c4b5fd" direction="rtl" text-anchor="start">فارسی · العربية · עברית</text>

    <!-- Before: every paragraph laid out left-to-right, as Claude Code draws it -->
    <rect x="64" y="216" width="560" height="300" rx="20" fill="#151a2e" stroke="#ef4444" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="100" cy="256" r="12" fill="#ef4444"/>
    <path d="M94 250 l12 12 M106 250 l-12 12" stroke="#151a2e" stroke-width="3" stroke-linecap="round"/>
    <text x="124" y="265" font-size="24" font-weight="700" fill="#fca5a5">Before</text>
    <g font-size="25" fill="#e5e7eb">
      <text x="96" y="330">فایل config.json رو باز کن.</text>
      <text x="96" y="384">نسخه 2.1 روی پورت 3000 اجرا شد!</text>
      <text x="96" y="438">افتح ملف config.json الآن.</text>
      <text x="96" y="492">פתח את הקובץ config.json עכשיו.</text>
    </g>

    <!-- After: the same text laid out right-to-left, still starting at the left edge -->
    <rect x="656" y="216" width="560" height="300" rx="20" fill="#151a2e" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="692" cy="256" r="12" fill="#22c55e"/>
    <path d="M686 256 l4 5 l9 -10" fill="none" stroke="#151a2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="716" y="265" font-size="24" font-weight="700" fill="#86efac">After</text>
    <g font-size="25" fill="#e5e7eb" direction="rtl" text-anchor="end">
      <text x="688" y="330">فایل config.json رو باز کن.</text>
      <text x="688" y="384">نسخه 2.1 روی پورت 3000 اجرا شد!</text>
      <text x="688" y="438">افتح ملف config.json الآن.</text>
      <text x="688" y="492">פתח את הקובץ config.json עכשיו.</text>
    </g>
  </g>

  <rect x="64" y="548" width="1152" height="56" rx="14" fill="#0a0d1a" stroke="#2e3557"/>
  <text x="92" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#a5adc6"><tspan fill="#a78bfa">/plugin install</tspan> rtl-text --marketplace <tspan fill="#ffffff">smhosseini72/claude-code-rtl</tspan></text>
</svg>
